name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public placeholders so `next build` can compile; no real project is contacted.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # Fails on critical advisories. One known high advisory remains: Next 15
      # bundles postcss 8.4.31 for its build-time CSS pipeline, and the only fix
      # offered is the Next 16 major upgrade (an override breaks the build). It
      # never runs in the shipped app. Tighten to `high` once Next is upgraded.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  integration:
    name: Integration tests (local Supabase)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npm run db:start
      - name: Write local environment
        run: npm run db:env
      - name: Integration tests
        run: npm run test:integration
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  e2e:
    name: End-to-end tests (Playwright)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:start
      - run: npm run db:env
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
